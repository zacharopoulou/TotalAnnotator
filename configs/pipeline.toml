[input]
mode = "pmids"
pmids = ["36403686"]

[enrichment]
sources = []

[annotators]
enabled = ["bern2", "flair", "pubtator3"]  # add "aioner" or "bent" after running the matching tools/*/setup.sh

[annotators.bern2]
runtime = "remote_api"
base_url = "http://127.0.0.1:8888"
endpoint = "http://bern2.korea.ac.kr/plain"

[annotators.flair]
model = "hunflair2"

[annotators.pubtator3]
runtime = "remote_api"
endpoint = "https://www.ncbi.nlm.nih.gov/research/pubtator3-api"
format = "biocjson"
timeout = 60
mode = "auto"
bioconcept = "All"

# AIONER runs in its own Python 3.8 environment; run tools/aioner/setup.sh first.
[annotators.aioner]
repo = "AIONER"
model = "AIONER/pretrained_models/AIONER/PubmedBERT-CRF-AIONER.h5"
entity = "ALL"
project = "tools/aioner"

# Clinical-AI-Apollo/Medical-NER is a local HuggingFace clinical NER model; add
# "apollo" to enabled above after installing the optional deps: uv sync --extra apollo
[annotators.apollo]
model = "Clinical-AI-Apollo/Medical-NER"

# d4data is a local HuggingFace clinical NER model; add "d4data" to enabled above
# after installing the optional deps with: uv sync --extra d4data
[annotators.d4data]
model = "d4data/biomedical-ner-all"

# BENT runs in its own Python <=3.10.13 environment; run tools/bent/setup.sh first.
[annotators.bent]
runtime = "local_subprocess"
mode = "ner_nel"
project = "tools/bent"
timeout = 900

[annotators.bent.types]
disease = "medic"
chemical = "chebi"
gene = "ncbi_gene"
organism = "ncbi_taxon"
anatomical = "uberon"
cell_line = "cellosaurus"
bioprocess = "go_bp"
cell_component = "go_cc"
cell_type = "cell_ontology"

[filters]
entity_types = []

[output]
path = "outputs/annotators_result.json"
