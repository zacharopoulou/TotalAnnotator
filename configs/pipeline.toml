[input]
mode = "pmids"
pmids = ["36403686"]

[enrichment]
sources = []

[annotators]
enabled = ["bern2", "flair", "pubtator3"]

[annotators.bern2]
runtime = "remote_api"
base_url = "http://127.0.0.1:8888"

[annotators.flair]
model = "hunflair2"

[annotators.pubtator3]
runtime = "remote_api"
endpoint = "https://www.ncbi.nlm.nih.gov/research/pubtator3-api"
format = "biocjson"
timeout = 60
mode = "auto"
bioconcept = "All"

[filters]
entity_types = []

[output]
path = "outputs/three_annotators.json"