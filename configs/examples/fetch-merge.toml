# Merge three fetch sources into one canonical Document per PMID.
# Order in `source` is the merge order: the first non-empty value wins for
# title/abstract/full_text/year. Metadata keys accumulate without overwriting,
# so each source contributes its own payload (pubtator3_payload, pubmed_record,
# epmc_meta) and the orchestrator records origin_sources on the merged Document.
#
# Each source can keep a different metadata slice via [input.fields_per_source].
# Sources without an override use the global `fields` list, or everything if
# neither is set.
#
# Full-text body opt-in (only when the paper is in PubMed Central):
# - PubTator3:  add  [input.pubtator3] full_text = true
# - Europe PMC: add  "full_text"  to its fields_per_source list below.

[input]
mode = "pmid_file"
pmid_file = "data/inputs/example_pmids.txt"
source = ["pubtator3", "entrez", "europe_pmc"]

[input.fields_per_source]
entrez = ["mesh_terms", "authors", "journal", "year"]
europe_pmc = ["citation_count", "is_open_access", "license"]

[annotators]
enabled = []

[output]
path = "outputs/examples/fetch-merge.json"
