# PubTator3 as the fetch source. PubTator3 is the implicit default when
# [input].source is omitted.
#
# To opt into body text (works only when the paper is in PubMed Central),
# add:
#
#   [input.pubtator3]
#   full_text = true

[input]
mode = "pmid_file"
pmid_file = "data/inputs/example_pmids.txt"
source = "pubtator3"

[annotators]
enabled = []

[output]
path = "outputs/examples/fetch-pubtator.json"
