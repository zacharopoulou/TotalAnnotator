[input]
mode = "text_table"
text_file = "data/inputs/plain_text.tsv"
format = "tsv"
document_id_column = "document_id"
title_column = "title"
abstract_column = "abstract"

[enrichment]
sources = []

[annotators]
enabled = ["pubtator3"]

[annotators.pubtator3]
runtime = "remote_api"
endpoint = "https://www.ncbi.nlm.nih.gov/research/pubtator3-api"
format = "biocjson"
timeout = 45
mode = "text_only"
bioconcept = "All"
poll_interval_seconds = 2.0
poll_backoff = 1.25
max_poll_interval_seconds = 5.0
max_poll_attempts = 12
max_poll_seconds = 45.0

[filters]
entity_types = []

[output]
path = "outputs/examples/corpus-file.json"
