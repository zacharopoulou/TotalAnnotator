[input]
mode = "corpus"
corpus_path = "data/corpora/example_documents.json"

[enrichment]
sources = []

[annotators]
enabled = []

[annotators.bern2]
runtime = "docker"
base_url = "http://127.0.0.1:8888"

[annotators.flair]
runtime = "python_local"

[annotators.pubtator3]
runtime = "remote_api"
endpoint = "https://www.ncbi.nlm.nih.gov/research/pubtator3-api"
format = "biocjson"
timeout = 60

[filters]
entity_types = []

[output]
path = "outputs/examples/corpus-file.json"
