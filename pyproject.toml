[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "totalannotator"
version = "0.1.0"
description = "Config-first biomedical literature pipeline for corpora, annotators, and evaluation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.8",
    "rich>=13.7",
]

[project.optional-dependencies]
flair = [
    "flair==0.15.1",
]
clinicalbert = [
    # ClinicalBERT (samrawal/bert-base-uncased_clinical-ner) --> HuggingFace
    # transformers token-classification model; it needs transformers + a torch
    # backend to run locally.
    "transformers>=4.30,<5",
    "torch>=2.0",
]
apollo = [
    # Clinical-AI-Apollo/Medical-NER is a HuggingFace transformers token-
    # classification model; it needs transformers + a torch backend to run locally.
    "transformers>=4.30,<5",
    "torch>=2.0",
]
d4data = [
    # d4data/biomedical-ner-all is a HuggingFace transformers token-classification
    # model; it needs transformers + a torch backend to run locally.
    "transformers>=4.30,<5",
    "torch>=2.0",
]
stanza = [
    "stanza>=1.8",
]
scispacy = [
    # spaCy/thinc wheels used by scispaCy 0.5.x are not yet NumPy 2 ABI-safe.
    "numpy>=1.26,<2.0",
    "scispacy>=0.5.5",
    "en-core-sci-scibert @ https://s3-us-west-2.amazonaws.com/ai2-s2-scispacy/releases/v0.5.4/en_core_sci_scibert-0.5.4.tar.gz",
    "en-ner-bc5cdr-md @ https://s3-us-west-2.amazonaws.com/ai2-s2-scispacy/releases/v0.5.4/en_ner_bc5cdr_md-0.5.4.tar.gz",
    "en-ner-bionlp13cg-md @ https://s3-us-west-2.amazonaws.com/ai2-s2-scispacy/releases/v0.5.4/en_ner_bionlp13cg_md-0.5.4.tar.gz",
    "en-ner-jnlpba-md @ https://s3-us-west-2.amazonaws.com/ai2-s2-scispacy/releases/v0.5.4/en_ner_jnlpba_md-0.5.4.tar.gz",
]
benchmarks = [
    # bigbio corpora ship as Hugging Face dataset scripts; datasets>=4 removed
    # script support, so pin to the 2.x/3.x line that still loads them.
    "datasets>=2.14,<4.0",
    "pandas>=2.0",
    "tabulate>=0.9",
]
all = [
    "totalannotator[flair,clinicalbert,apollo,d4data,stanza,scispacy,benchmarks]",
]

[project.scripts]
totalannotator = "bio_annotation.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"bio_annotation.report" = ["template.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "integration: marks tests that make live external service calls",
]
