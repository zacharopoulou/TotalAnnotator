[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "totalannotator"
version = "0.1.0"
description = "Config-first biomedical literature pipeline for corpora, annotators, and evaluation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
]

[project.optional-dependencies]
flair = [
    "flair==0.15.1",
]
benchmarks = [
    # bigbio corpora ship as Hugging Face dataset scripts; datasets>=4 removed
    # script support, so pin to the 2.x/3.x line that still loads them.
    "datasets>=2.14,<4.0",
    "pandas>=2.0",
    "tabulate>=0.9",
]
all = [
    "totalannotator[flair,benchmarks]",
]

[project.scripts]
totalannotator = "bio_annotation.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "integration: marks tests that make live external service calls",
]
