[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "totalannotator"
version = "0.1.0"
description = "Config-first biomedical literature pipeline for corpora, annotators, and evaluation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flair==0.15.1",
]

[project.optional-dependencies]
# Fetch & annotate explorer (Streamlit). Flair is a default dependency for HunFlair2 in CLI and library.
ui = [
    "streamlit>=1.28.0",
]
# Back-compat extra: `pip install -e ".[flair]"` still works; Flair is already installed with the base package.
flair = []

[project.scripts]
totalannotator = "bio_annotation.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "integration: marks tests that make live external service calls",
]
