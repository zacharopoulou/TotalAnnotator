<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">TotalAnnotator workflow overview</title>
  <desc id="desc">A left-to-right flow chart showing config and document inputs, validation, annotator execution, harmonization, agreement scoring, and exported outputs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef5ef"/>
    </linearGradient>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #17324d; }
      .label { font: 700 16px Arial, sans-serif; fill: #17324d; }
      .body { font: 400 14px Arial, sans-serif; fill: #34506a; }
      .box { fill: #ffffff; stroke: #295a84; stroke-width: 2; rx: 18; ry: 18; }
      .accent { fill: #eef7ff; stroke: #295a84; stroke-width: 2; rx: 18; ry: 18; }
      .green { fill: #eef8ef; stroke: #3e7a44; stroke-width: 2; rx: 18; ry: 18; }
      .arrow { stroke: #4c6d8c; stroke-width: 3; fill: none; marker-end: url(#m); }
      .note { font: 600 13px Arial, sans-serif; fill: #3e7a44; }
    </style>
    <marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#4c6d8c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="430" fill="url(#bg)"/>
  <text x="60" y="55" class="title">TotalAnnotator Near-Term Workflow</text>

  <rect x="40" y="95" width="180" height="120" class="box"/>
  <text x="62" y="128" class="label">Inputs</text>
  <text x="62" y="156" class="body">Single PMID</text>
  <text x="62" y="178" class="body">PMID file</text>
  <text x="62" y="200" class="body">CSV/TSV title + abstract</text>

  <rect x="260" y="95" width="200" height="120" class="accent"/>
  <text x="282" y="128" class="label">Config + Validation</text>
  <text x="282" y="156" class="body">Chosen annotators</text>
  <text x="282" y="178" class="body">Requested entity types</text>
  <text x="282" y="200" class="body">Coverage checks and warnings</text>

  <rect x="500" y="95" width="185" height="120" class="box"/>
  <text x="522" y="128" class="label">Annotator Execution</text>
  <text x="522" y="156" class="body">Managed runtimes</text>
  <text x="522" y="178" class="body">BERN2 / PubTator3 / Flair</text>
  <text x="522" y="200" class="body">User-selected subset only</text>

  <rect x="725" y="95" width="200" height="120" class="accent"/>
  <text x="747" y="128" class="label">Harmonization</text>
  <text x="747" y="156" class="body">Shared annotation schema</text>
  <text x="747" y="178" class="body">Unified types and offsets</text>
  <text x="747" y="200" class="body">Original labels preserved</text>

  <rect x="965" y="95" width="190" height="120" class="green"/>
  <text x="987" y="128" class="label">Agreement Confidence</text>
  <text x="987" y="156" class="body">Overlap-based grouping</text>
  <text x="987" y="178" class="body">Lexicon-backed ID linking</text>
  <text x="987" y="200" class="body">Annotator support strength</text>

  <rect x="285" y="275" width="260" height="95" class="box"/>
  <text x="307" y="308" class="label">Document Layer</text>
  <text x="307" y="336" class="body">Canonical text, title, abstract, PMID, offsets</text>

  <rect x="625" y="275" width="320" height="95" class="green"/>
  <text x="647" y="308" class="label">Outputs</text>
  <text x="647" y="336" class="body">Per-annotator annotations, consensus groups, JSON/TSV summary</text>

  <path d="M220 155 L260 155" class="arrow"/>
  <path d="M460 155 L500 155" class="arrow"/>
  <path d="M685 155 L725 155" class="arrow"/>
  <path d="M925 155 L965 155" class="arrow"/>
  <path d="M130 215 L130 255 L415 255 L415 275" class="arrow"/>
  <path d="M825 215 L825 275" class="arrow"/>
  <path d="M1055 215 L1055 255 L945 255 L945 322" class="arrow"/>

  <text x="972" y="252" class="note">confidence combines span overlap,</text>
  <text x="972" y="271" class="note">type agreement, ID linking, and support count</text>
</svg>
